# H2 in-memory database — replaces MySQL for the test slice.
#
# MODE=MySQL tells H2 to accept MySQL-style DDL (AUTO_INCREMENT, etc.) and
# to handle MySQL quoting rules, so Hibernate can run the same dialect
# against H2 that it uses in production without any changes to entity code.
#
# NON_KEYWORDS=value stops H2 treating VALUE as a reserved word, which
# conflicts with Hibernate's column alias generation.
spring.datasource.url=jdbc:h2:mem:tickethub;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console is useful when debugging test failures locally.
spring.h2.console.enabled=true

# create-drop builds the schema fresh for every test run and tears it down on exit.
spring.jpa.hibernate.ddl-auto=create-drop

# Keep logging readable during test runs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# No open-in-view, same as production.
spring.jpa.open-in-view=false

