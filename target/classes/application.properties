spring.application.name=tickethub

# Replace the placeholders with your local MySQL username and password.
# createDatabaseIfNotExist creates the tickethub schema on first connect.
spring.datasource.url=jdbc:mysql://localhost:3306/tickethub?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates missing tables and adds new columns. It does not drop data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep database sessions inside the service layer, not open for the whole HTTP request.
spring.jpa.open-in-view=false
